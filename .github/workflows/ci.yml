name: Front CI and artifact publication

run-name: Validate and publish Front ${{ github.sha }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, build, and verify immutable site artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify frontend contracts
        run: node --test

      - name: Build static site
        run: node scripts/build.mjs

      - name: Create immutable site artifact
        id: artifact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          PRODUCER_RUN_ID: ${{ github.run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          node scripts/site-artifact.mjs create
          --source dist
          --output "${{ runner.temp }}/front-artifact"
          --commit "$SOURCE_COMMIT"
          --workflow-commit "$WORKFLOW_COMMIT"
          --run-id "$PRODUCER_RUN_ID"
          --run-attempt "$PRODUCER_RUN_ATTEMPT"

      - name: Verify immutable site artifact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          node scripts/site-artifact.mjs verify
          --artifact-dir "${{ runner.temp }}/front-artifact"
          --commit "$SOURCE_COMMIT"

      - name: Publish commit-addressed site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: endlessnet-front-${{ github.sha }}
          path: ${{ runner.temp }}/front-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
