name: Deploy published Front artifact to GitHub Pages

on:
  workflow_run:
    workflows:
      - Front CI and artifact publication
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download exact immutable site artifact
        uses: actions/download-artifact@v4
        with:
          name: endlessnet-front-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/front-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and extract immutable site artifact
        env:
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node scripts/site-artifact.mjs verify
          --artifact-dir "${{ runner.temp }}/front-artifact"
          --commit "$SOURCE_COMMIT"
          --extract dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
